<div align="center">
    <h2>Add User</h2>

    <h3 style="color: red;">{{form.errorMessage}}</h3>
    <h3 style="color: green;">{{form.successMessage}}</h3>

    <form (submit)="save()">

        <table>
            <tr>
                <th>First Name</th>
                <td><input type="text" name="firstName"
                    [(ngModel)]="form.data.firstName"
                    placeholder="Enter first name"></td>
                <td style="color: red;">{{form.inputerror.firstName}}</td>
            </tr>

            <tr>
                <th>Last Name</th>
                <td><input type="text" name="lastName"
                    [(ngModel)]="form.data.lastName"
                    placeholder="Enter last name"></td>
                <td style="color: red;">{{form.inputerror.lastName}}</td>
            </tr>

            <tr>
                <th>Login</th>
                <td><input type="text" name="login"
                    [(ngModel)]="form.data.login"
                    placeholder="Enter login"></td>
                <td style="color: red;">{{form.inputerror.login}}</td>
            </tr>

            <tr>
                <th>Password</th>
                <td><input type="password" name="password"
                    [(ngModel)]="form.data.password"
                    placeholder="Enter password"></td>
                <td style="color: red;">{{form.inputerror.password}}</td>
            </tr>

            <tr>
                <th>Role ID</th>
                <td><input type="number" name="roleId"
                    [(ngModel)]="form.data.roleId"
                    placeholder="Enter role ID"></td>
                <td style="color: red;">{{form.inputerror.roleId}}</td>
            </tr>

            <tr>
                <th></th>
                <td><input type="submit" value="Save"></td>
            </tr>
        </table>

    </form>
</div>
