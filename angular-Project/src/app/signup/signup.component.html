<div align="center">
    <h2>Signup</h2>
    <form>

        <table>
            <tr>
                <th>First Name</th>
                <td><input type="text" name="firstName" placeholder="Enter your first name"></td>
            </tr>

            <tr>
                <th>Last Name</th>
                <td><input type="text" name="lastName" placeholder="Enter your last name"></td>
            </tr>

            <tr>
                <th>Login</th>
                <td><input type="text" name="login" placeholder="Enter your login"></td>
            </tr>

            <tr>
                <th>Email</th>
                <td><input type="email" name="email" placeholder="Enter your email"></td>
            </tr>

            <tr>
                <th>Password</th>
                <td><input type="password" name="password" placeholder="Enter your password"></td>
            </tr>

            <tr>
                <th>Confirm Password</th>
                <td><input type="password" name="confirmPassword" placeholder="Confirm your password"></td>
            </tr>

            <tr>
                <th></th>
                <td><input type="submit" value="Signup"></td>
            </tr>
        </table>

    </form>
</div>
